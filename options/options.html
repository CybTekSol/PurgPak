<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PurgPak Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>PurgPak Configuration</h1>
      <span class="version">v1.5.0 by CybTekSol [ https://github.com/CybTekSol ]</span>
    </header>

    <section class="card">
      <h2>Notifications</h2>
      <label class="toggle-row">
        <input type="checkbox" id="notify_summary">
        <span>Show summary notification upon completion</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="play_sound">
        <span>Play notification sound upon completion</span>
      </label>
    </section>

    <section class="card">
      <h2>Per-Account Processing Rules</h2>
      <p class="description">Enable PurgPak for specific accounts and customize what actions run for each.</p>
      <table class="account-table" id="accounts_table">
        <thead>
          <tr>
            <th>Account</th>
            <th>Empty Junk</th>
            <th>Empty Trash</th>
            <th>Compact Folders</th>
          </tr>
        </thead>
        <tbody id="accounts_tbody">
          <!-- Dynamically injected account rows -->
        </tbody>
      </table>
    </section>

    <footer>
      <button id="save_btn" class="primary-btn">Save Settings</button>
      <span id="status_msg" class="status-msg"></span>
    </footer>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
